<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Foodies</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7f7;
        }

        .profile-page {
            min-height: 100vh;
        }

        /* HEADER */

        .profile-header {
            background: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .profile-logo {
            color: #ff6b00;
            font-size: 26px;
            font-weight: 800;
        }

        .back-btn {
            border: none;
            background: #fff1e8;
            color: #ff6b00;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        /* MAIN */

        .profile-container {
            width: 90%;
            max-width: 850px;
            margin: auto;
            padding: 40px 0;
        }

        .profile-title {
            margin-bottom: 25px;
        }

        .profile-title h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .profile-title p {
            color: #777;
            margin: 0;
        }

        /* CARD */

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
        }

        /* AVATAR */

        .profile-avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #ff6b00;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 32px;
            font-weight: 700;
        }

        #profileName {
            margin-top: 12px;
            font-size: 21px;
            font-weight: 700;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #ff6b00;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* PASSWORD */

        .password-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .password-section h3 {
            margin: 0 0 5px;
        }

        .password-section p {
            margin: 0 0 18px;
            color: #777;
            font-size: 14px;
        }

        /* BUTTON */

        .save-btn {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #ff6b00;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #e85f00;
        }

        /* MESSAGE */

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .profile-header {
                padding: 16px 4%;
            }

            .profile-logo {
                font-size: 22px;
            }

            .profile-container {
                width: 92%;
                padding: 30px 0;
            }

            .profile-card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

    <script src="js/notifications.js"></script>

</head>

<body>

<div class="profile-page">

    <!-- HEADER -->

    <header class="profile-header">

        <div class="profile-logo">
            🍔 Foodies
        </div>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Dashboard

        </button>

    </header>


    <!-- MAIN -->

    <main class="profile-container">

        <div class="profile-title">

            <h1>
                My Profile
            </h1>

            <p>
                Manage your personal information and account details.
            </p>

        </div>


        <div class="profile-card">

            <!-- AVATAR -->

            <div class="profile-avatar-section">

                <div
                    class="profile-avatar"
                    id="avatar">

                    V

                </div>

                <div id="profileName">
                    Loading...
                </div>

            </div>


            <!-- FORM -->

            <form id="profileForm">

                <div class="form-grid">

                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            required>

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="phone"
                            required>

                    </div>


                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="role">
                            Account Role
                        </label>

                        <input
                            type="text"
                            id="role"
                            readonly>

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full">

                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            placeholder="Enter your delivery address">
                        </textarea>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="password-section">

                    <h3>
                        Change Password
                    </h3>

                    <p>
                        Leave this field blank if you don't want to change your password.
                    </p>

                    <div class="form-group">

                        <label for="password">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter new password">

                    </div>

                </div>


                <!-- MESSAGE -->

                <div id="message"></div>


                <!-- SAVE -->

                <button
                    type="submit"
                    class="save-btn">

                    Save Changes

                </button>

            </form>

        </div>

    </main>

</div>


<script>

    const token =
        localStorage.getItem("foodiesToken");


    /* LOGIN CHECK */

    if (!token) {

        window.location.href =
            "login.html";

    }


    let currentUserId = null;


    /* GET USER FROM JWT */

    function getEmailFromToken() {

        try {

            const payload =
                JSON.parse(
                    atob(
                        token
                            .split(".")[1]
                            .replace(/-/g, "+")
                            .replace(/_/g, "/")
                    )
                );

            return payload.sub;

        } catch (error) {

            console.error(
                "Token error:",
                error
            );

            return null;

        }

    }


    /* LOAD PROFILE */

    async function loadProfile() {

        try {

            const email =
                getEmailFromToken();


            if (!email) {

                throw new Error(
                    "Invalid login session"
                );

            }


            const response =
                await fetch(
                    `/api/users/by-email?email=${encodeURIComponent(email)}`,
                    {
                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load profile"
                );

            }


            const user =
                await response.json();


            currentUserId =
                user.id;


            /* SET VALUES */

            document.getElementById("name").value =
                user.name || "";


            document.getElementById("email").value =
                user.email || "";


            document.getElementById("phone").value =
                user.phone || "";


            document.getElementById("address").value =
                user.address || "";


            document.getElementById("role").value =
                user.role || "CUSTOMER";


            document.getElementById("profileName").textContent =
                user.name || "Foodies User";


            /* AVATAR */

            if (user.name) {

                document.getElementById("avatar").textContent =
                    user.name.charAt(0).toUpperCase();

            }


        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

            showMessage(
                "Unable to load profile.",
                "error"
            );

        }

    }


    /* SAVE PROFILE */

    document.getElementById("profileForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!currentUserId) {

                    showMessage(
                        "User information not loaded.",
                        "error"
                    );

                    return;

                }


                const password =
                    document.getElementById("password").value;


                const updateData = {

                    name:
                        document.getElementById("name").value,

                    email:
                        document.getElementById("email").value,

                    phone:
                        document.getElementById("phone").value,

                    address:
                        document.getElementById("address").value,

                    role:
                        document.getElementById("role").value,

                    password:
                        password

                };


                try {

                    const response =
                        await fetch(
                            `/api/users/${currentUserId}`,
                            {
                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " + token

                                },

                                body:
                                    JSON.stringify(
                                        updateData
                                    )

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Profile update failed"
                        );

                    }


                    const updatedUser =
                        await response.json();


                    /* UPDATE SCREEN */

                    document.getElementById("profileName")
                        .textContent =
                        updatedUser.name;


                    if (updatedUser.name) {

                        document.getElementById("avatar")
                            .textContent =
                            updatedUser.name
                                .charAt(0)
                                .toUpperCase();

                    }


                    document.getElementById("password").value =
                        "";


                    showMessage(
                        "Profile updated successfully! ✅",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Profile update error:",
                        error
                    );


                    showMessage(
                        "Unable to update profile. Please try again.",
                        "error"
                    );

                }

            }
        );


    /* MESSAGE */

    function showMessage(text, type) {

        const message =
            document.getElementById("message");


        message.textContent =
            text;


        message.style.display =
            "block";


        if (type === "success") {

            message.style.background =
                "#e8f8ee";

            message.style.color =
                "#18864b";

        } else {

            message.style.background =
                "#ffe8e8";

            message.style.color =
                "#c62828";

        }


        setTimeout(function() {

            message.style.display =
                "none";

        }, 4000);

    }


    /* BACK */

    function goBack() {

        window.location.href =
            "customer-dashboard.html";

    }


    /* START */

    loadProfile();

</script>

</body>

</html>
