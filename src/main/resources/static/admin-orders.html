<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodies - All Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: #ff4d2d;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back-btn {
            background: white;
            color: #ff4d2d;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #666;
        }

        .orders-container {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .order-id {
            font-size: 22px;
            font-weight: bold;
        }

        .status {
            background: #fff1ed;
            color: #ff4d2d;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .detail-box {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 10px;
        }

        .label {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            font-weight: bold;
            word-break: break-word;
        }

        .empty-box {
            background: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .empty-box .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-box h2 {
            margin-bottom: 8px;
        }

        .empty-box p {
            color: #777;
        }

        @media (max-width: 800px) {

            .order-details {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .header {
                padding: 18px 20px;
            }

            .container {
                padding: 25px 18px;
            }

            .order-top {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .page-title h1 {
                font-size: 27px;
            }

        }
    </style>
    <script src="js/notifications.js"></script>

</head>

<body>

<header class="header">

    <div class="logo">
        🍔 Foodies Admin
    </div>

    <button class="back-btn" onclick="goBack()">
        ← Dashboard
    </button>

</header>


<main class="container">

    <div class="page-title">

        <h1>All Orders</h1>

        <p>
            View and manage customer orders.
        </p>

    </div>


    <div id="ordersContainer" class="orders-container">

        <div class="empty-box">
            <div class="icon">⏳</div>

            <h2>Loading Orders...</h2>

            <p>
                Please wait while orders are loaded.
            </p>
        </div>

    </div>

</main>


<script>

    const token =
        localStorage.getItem("foodiesToken");


    if (!token) {

        window.location.href =
            "login.html";

    }


    async function loadOrders() {

        try {

            const response =
                await fetch(
                    "/api/orders",
                    {
                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load orders"
                );

            }


            const orders =
                await response.json();


            const container =
                document.getElementById(
                    "ordersContainer"
                );


            if (orders.length === 0) {

                container.innerHTML = `
                    <div class="empty-box">

                        <div class="icon">📦</div>

                        <h2>No Orders Found</h2>

                        <p>
                            There are currently no customer orders.
                        </p>

                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            orders.forEach(function(order) {

                const card =
                    document.createElement("div");

                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-top">

                        <div class="order-id">
                            Order #${order.id}
                        </div>

                        <div class="status">
                            ${order.status || "PLACED"}
                        </div>

                    </div>

                    <div style="margin-bottom: 20px;">

                        <label style="
                            display: block;
                            margin-bottom: 8px;
                            font-weight: bold;
                        ">
                            Update Order Status
                        </label>

                        <select
                            id="status-${order.id}"
                            style="
                                padding: 10px;
                                border-radius: 8px;
                                border: 1px solid #ddd;
                                width: 220px;
                                margin-right: 10px;
                            "
                        >

                            <option value="PLACED"
                                ${order.status === "PLACED" ? "selected" : ""}>
                                PLACED
                            </option>

                            <option value="CONFIRMED"
                                ${order.status === "CONFIRMED" ? "selected" : ""}>
                                CONFIRMED
                            </option>

                            <option value="PREPARING"
                                ${order.status === "PREPARING" ? "selected" : ""}>
                                PREPARING
                            </option>

                            <option value="OUT_FOR_DELIVERY"
                                ${order.status === "OUT_FOR_DELIVERY" ? "selected" : ""}>
                                OUT FOR DELIVERY
                            </option>

                            <option value="DELIVERED"
                                ${order.status === "DELIVERED" ? "selected" : ""}>
                                DELIVERED
                            </option>

                        </select>

                        <button
                            onclick="updateOrderStatus(${order.id})"
                            style="
                                padding: 10px 16px;
                                border: none;
                                border-radius: 8px;
                                background: #ff4d2d;
                                color: white;
                                font-weight: bold;
                                cursor: pointer;
                            "
                        >
                            Update
                        </button>

                    </div>


                    <div class="order-details">

                        <div class="detail-box">

                            <span class="label">
                                Customer ID
                            </span>

                            <span class="value">
                                ${order.userId || "N/A"}
                            </span>

                        </div>


                        <div class="detail-box">

                            <span class="label">
                                Restaurant ID
                            </span>

                            <span class="value">
                                ${order.restaurantId || "N/A"}
                            </span>

                        </div>


                        <div class="detail-box">

                            <span class="label">
                                Total Amount
                            </span>

                            <span class="value">
                                ₹${order.totalPrice || 0}
                            </span>

                        </div>


                        <div class="detail-box">

                            <span class="label">
                                Payment Status
                            </span>

                            <span class="value">
                                ${order.paymentStatus || "PENDING"}
                            </span>

                        </div>


                        <div class="detail-box">

    <span class="label">
        Delivery Partner
    </span>

    <span class="value">
        ${
            order.deliveryPartner
            ? "Partner ID: " + order.deliveryPartner.id
            : "Not Assigned"
        }
    </span>

</div>

<div style="margin-top: 15px;">

    <label style="
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    ">
        Assign Delivery Partner
            </label>

            <select
                id="partner-${order.id}"
                style="
                    padding: 10px;
                    border-radius: 8px;
                    border: 1px solid #ddd;
                    margin-right: 10px;
                "
            >

                <option value="2">
                    Rahul Kumar (ID: 2)
                </option>

            </select>

            <button
                onclick="assignDeliveryPartner(${order.id})"
                style="
                    padding: 10px 16px;
                    border: none;
                    border-radius: 8px;
                    background: #ff4d2d;
                    color: white;
                    font-weight: bold;
                    cursor: pointer;
                "
            >
                Assign
            </button>

        </div>

                    </div>

                `;


                container.appendChild(card);

            });


        } catch (error) {

            console.error(
                "Admin orders error:",
                error
            );


            document.getElementById(
                "ordersContainer"
            ).innerHTML = `

                <div class="empty-box">

                    <div class="icon">⚠️</div>

                    <h2>Unable to Load Orders</h2>

                    <p>
                        Please check the server and try again.
                    </p>

                </div>

            `;

        }

    }

    async function updateOrderStatus(orderId) {

    const status =
        document.getElementById(
            "status-" + orderId
        ).value;

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/status?status=${encodeURIComponent(status)}`,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Status update failed"
            );

        }


        alert(
            "Order #" +
            orderId +
            " status updated to " +
            status
        );


        loadOrders();


    } catch (error) {

        console.error(
            "Status update error:",
            error
        );

        alert(
            "Unable to update order status."
        );

    }
}       

        async function assignDeliveryPartner(orderId) {

    const partnerId =
        document.getElementById(
            "partner-" + orderId
        ).value;

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/assign-delivery-partner/${partnerId}`,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        if (!response.ok) {
            throw new Error(
                "Assignment failed"
            );
        }

        alert(
            "Delivery Partner assigned successfully! ✅"
        );

        loadOrders();

    } catch (error) {

        console.error(
            "Assignment error:",
            error
        );

        alert(
            "Unable to assign delivery partner."
        );

    }

}


    function goBack() {

        window.location.href =
            "admin-dashboard.html";

    }


    loadOrders();

</script>

</body>
</html>
