<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodies - Delivery Partners</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #dd2476;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-bar h2 {
            color: #333;
        }

        .add-btn {
            background: #ff512f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #e84322;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f1f3f7;
            padding: 14px;
            text-align: left;
            color: #555;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fafafa;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-select {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            background: white;
        }

        .available {
            background: #d4edda;
            color: #155724;
        }

        .offline {
            background: #f8d7da;
            color: #721c24;
        }

        .busy {
            background: #fff3cd;
            color: #856404;
        }

        .action-btn {
            border: none;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 13px;
        }

        .edit-btn {
            background: #007bff;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .status-btn {
            background: #6f42c1;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 500px;
            padding: 25px;
            border-radius: 14px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff512f;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                width: 92%;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
    <script src="js/notifications.js"></script>

</head>

<body>

<div class="header">

    <h1>🚴 Foodies - Delivery Partners</h1>

    <button class="back-btn"
            onclick="window.location.href='admin-dashboard.html'">
        ← Dashboard
    </button>

</div>


<div class="container">

    <div class="top-bar">

        <h2>Manage Delivery Partners</h2>

        <button class="add-btn" onclick="openAddModal()">
            + Add Delivery Partner
        </button>

    </div>


    <div class="table-container">

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody id="deliveryTableBody">

            </tbody>

        </table>

        <div id="emptyMessage"
             class="empty"
             style="display:none;">
            No delivery partners found.
        </div>

    </div>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="deliveryModal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Add Delivery Partner
        </h2>


        <div class="form-group">

            <label>Name</label>

            <input type="text"
                   id="partnerName"
                   placeholder="Enter name">

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input type="text"
                   id="partnerPhone"
                   placeholder="Enter phone number">

        </div>


        <div class="form-group">

            <label>Status</label>

            <select id="partnerStatus">

                <option value="AVAILABLE">
                    AVAILABLE
                </option>

                <option value="BUSY">
                    BUSY
                </option>

                <option value="OFFLINE">
                    OFFLINE
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Latitude</label>

            <input type="number"
                   step="any"
                   id="partnerLatitude"
                   placeholder="e.g. 28.9845">

        </div>


        <div class="form-group">

            <label>Longitude</label>

            <input type="number"
                   step="any"
                   id="partnerLongitude"
                   placeholder="e.g. 77.7064">

        </div>


        <div class="modal-actions">

            <button class="cancel-btn"
                    onclick="closeModal()">
                Cancel
            </button>

            <button class="save-btn"
                    onclick="savePartner()">
                Save
            </button>

        </div>

    </div>

</div>


<script>

    const token = localStorage.getItem("foodiesToken");

    if (!token) {
        window.location.href = "login.html";
    }


    let partners = [];

    let editingId = null;


    async function loadPartners() {

        try {

            const response = await fetch(
                "/api/delivery-partners",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Failed to load delivery partners"
                );

            }


            partners = await response.json();

            displayPartners();

        } catch (error) {

            console.error(
                "Load partners error:",
                error
            );

            alert(
                "Unable to load delivery partners."
            );

        }

    }


    function displayPartners() {

        const tbody =
            document.getElementById(
                "deliveryTableBody"
            );

        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );


        tbody.innerHTML = "";


        if (!partners || partners.length === 0) {

            emptyMessage.style.display = "block";

            return;

        }


        emptyMessage.style.display = "none";


        partners.forEach(partner => {

            const row =
                document.createElement("tr");


            let statusClass = "offline";


            if (partner.status === "AVAILABLE") {

                statusClass = "available";

            } else if (partner.status === "BUSY") {

                statusClass = "busy";

            }


            const latitude =
                partner.latitude ?? "-";

            const longitude =
                partner.longitude ?? "-";


            row.innerHTML = `

                <td>${partner.id ?? "-"}</td>

                <td>${partner.name ?? "-"}</td>

                <td>${partner.phone ?? "-"}</td>

                <td>
                    <span class="status ${statusClass}">
                        ${partner.status ?? "OFFLINE"}
                    </span>
                </td>

                <td>
                    ${latitude}, ${longitude}
                </td>

                <td>

                    <button
                        class="action-btn edit-btn"
                        onclick="editPartner(${partner.id})">
                        Edit
                    </button>

                    <select
                      class="status-select"
                      onchange="changeStatus(${partner.id}, this.value)">

                      <option value="AVAILABLE"
                          ${partner.status === "AVAILABLE" ? "selected" : ""}>
                          AVAILABLE
                      </option>

                      <option value="BUSY"
                          ${partner.status === "BUSY" ? "selected" : ""}>
                          BUSY
                      </option>

                      <option value="OFFLINE"
                          ${partner.status === "OFFLINE" ? "selected" : ""}>
                          OFFLINE
                      </option>

                  </select>

                    <button
                        class="action-btn delete-btn"
                        onclick="deletePartner(${partner.id})">
                        Delete
                    </button>

                </td>

            `;


            tbody.appendChild(row);

        });

    }


    function openAddModal() {

        editingId = null;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Delivery Partner";


        document.getElementById(
            "partnerName"
        ).value = "";


        document.getElementById(
            "partnerPhone"
        ).value = "";


        document.getElementById(
            "partnerStatus"
        ).value =
            "AVAILABLE";


        document.getElementById(
            "partnerLatitude"
        ).value = "";


        document.getElementById(
            "partnerLongitude"
        ).value = "";


        document.getElementById(
            "deliveryModal"
        ).style.display =
            "flex";

    }


    function editPartner(id) {

        const partner =
            partners.find(
                p => p.id === id
            );


        if (!partner) {

            alert("Partner not found.");

            return;

        }


        editingId = id;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Delivery Partner";


        document.getElementById(
            "partnerName"
        ).value =
            partner.name || "";


        document.getElementById(
            "partnerPhone"
        ).value =
            partner.phone || "";


        document.getElementById(
            "partnerStatus"
        ).value =
            partner.status || "AVAILABLE";


        document.getElementById(
            "partnerLatitude"
        ).value =
            partner.latitude ?? "";


        document.getElementById(
            "partnerLongitude"
        ).value =
            partner.longitude ?? "";


        document.getElementById(
            "deliveryModal"
        ).style.display =
            "flex";

    }


    function closeModal() {

        document.getElementById(
            "deliveryModal"
        ).style.display =
            "none";

    }


    async function savePartner() {

        const name =
            document.getElementById(
                "partnerName"
            ).value.trim();


        const phone =
            document.getElementById(
                "partnerPhone"
            ).value.trim();


        const status =
            document.getElementById(
                "partnerStatus"
            ).value;


        const latitude =
            document.getElementById(
                "partnerLatitude"
            ).value;


        const longitude =
            document.getElementById(
                "partnerLongitude"
            ).value;


        if (!name || !phone) {

            alert(
                "Name and phone are required."
            );

            return;

        }


        const data = {

            name: name,

            phone: phone,

            status: status,

            latitude:
                latitude
                    ? Number(latitude)
                    : null,

            longitude:
                longitude
                    ? Number(longitude)
                    : null

        };


        try {

            let url =
                "/api/delivery-partners";

            let method = "POST";


            if (editingId !== null) {

                url += "/" + editingId;

                method = "PUT";

            }


            const response =
                await fetch(url, {

                    method: method,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify(data)

                });


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Server error:",
                    response.status,
                    errorText
                );

                throw new Error(
                    "Unable to save partner"
                );

            }


            alert(
                editingId !== null
                    ? "Delivery partner updated successfully."
                    : "Delivery partner added successfully."
            );


            closeModal();

            loadPartners();


        } catch (error) {

            console.error(
                "Save partner error:",
                error
            );

            alert(
                "Unable to save delivery partner."
            );

        }

    }


    async function changeStatus(id, status) {

    const partner =
        partners.find(p => p.id === id);

    if (!partner) {
        alert("Partner not found.");
        return;
    }

    const updatedPartner = {

        name: partner.name,

        phone: partner.phone,

        status: status,

        currentLocation:
            partner.currentLocation || null,

        latitude:
            partner.latitude ?? null,

        longitude:
            partner.longitude ?? null
    };

    try {

        const response =
            await fetch(
                "/api/delivery-partners/" + id,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify(updatedPartner)
                }
            );

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Status update error:",
                response.status,
                errorText
            );

            throw new Error(
                "Status update failed"
            );
        }

        alert(
            "Status updated successfully."
        );

        loadPartners();

    } catch (error) {

        console.error(
            "Status error:",
            error
        );

        alert(
            "Unable to update status."
        );

        loadPartners();
    }
}


    async function deletePartner(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this delivery partner?"
            );


        if (!confirmDelete) return;


        try {

            const response =
                await fetch(
                    "/api/delivery-partners/"
                    + id,
                    {

                        method: "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            alert(
                "Delivery partner deleted successfully."
            );


            loadPartners();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Unable to delete delivery partner."
            );

        }

    }


    loadPartners();

</script>

</body>
</html>
