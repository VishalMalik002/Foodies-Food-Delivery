<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodies | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

    <script src="js/notifications.js"></script>

</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-page">


    <!-- LEFT SIDE -->

    <section class="login-hero">

        <div class="login-hero-content">

            <div class="foodies-logo">
                FOODIES
            </div>

            <h1>
                Welcome<br>
                <span>Back.</span>
            </h1>

            <p>
                Your favourite flavours are waiting.
                Login and continue your Foodies journey.
            </p>

            <div class="login-food-line">
                🍕 &nbsp; 🍔 &nbsp; 🍜 &nbsp; 🍰 &nbsp; 🍟
            </div>

        </div>

    </section>


    <!-- RIGHT SIDE -->

    <section class="login-section">

        <div class="login-card">


            <!-- LOGIN HEADING -->

            <div class="login-heading">

                <div class="login-icon">
                    👋
                </div>

                <h2>
                    Welcome <span>Back!</span>
                </h2>

                <p>
                    Login to your Foodies account
                </p>

            </div>


            <!-- LOGIN METHOD -->

            <div class="login-method">

                <button
                    type="button"
                    id="emailLoginBtn"
                    class="login-method-btn active">

                    📧 Email

                </button>

                <button
                    type="button"
                    id="phoneLoginBtn"
                    class="login-method-btn">

                    📱 Phone

                </button>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div
                    class="input-group"
                    id="emailLoginGroup">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- PHONE -->

                <div
                    class="input-group"
                    id="phoneLoginGroup"
                    style="display: none;">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="loginPhone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group password-group">

                    <label>Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="loginTogglePassword">

                            👁

                        </button>

                    </div>

                </div>


                <!-- REMEMBER + FORGOT -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-submit-btn">

                    <span>
                        Login
                    </span>

                    <span>
                        →
                    </span>

                </button>

            </form>


            <!-- SIGNUP -->

            <div class="signup-link">

                <p>

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>

            </div>


            <!-- SECURITY -->

            <div class="login-security">

                🔐 Secure login powered by Foodies

            </div>

        </div>

    </section>

</div>


<script src="js/script.js"></script>

</body>

</html>
